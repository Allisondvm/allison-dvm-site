name: Deploy

# Builds the static site into a container image and pushes it to ghcr.io.
# The homelab Kubernetes cluster is the primary origin for allisondvm.com and
# pulls this image. GitHub is the source of truth.
#
# Required repository secrets (optional Cloudflare Pages mirror):
#   CLOUDFLARE_API_TOKEN   - token with Pages:Edit (only if Pages mirror enabled)
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
# (GITHUB_TOKEN is provided automatically for ghcr push.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/allisondvm/allison-dvm-site:latest
            ghcr.io/allisondvm/allison-dvm-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    name: Cloudflare Pages (mirror)
    runs-on: ubuntu-latest
    # Optional external mirror. Enable by setting repo variable
    # ENABLE_CLOUDFLARE_PAGES=true and the two Cloudflare secrets.
    if: ${{ vars.ENABLE_CLOUDFLARE_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=allison-dvm-site --branch=main --commit-dirty=true
