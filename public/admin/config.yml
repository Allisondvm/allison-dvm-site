# Sveltia CMS configuration — visual editor for allisondvm.com
#
# Backend: GitHub. Krista logs in with GitHub and edits content through a form
# UI (works well on mobile); Sveltia commits to this repo and CI rebuilds +
# deploys. Sveltia reads this Decap-format config unchanged.
#
# ONE-TIME AUTH SETUP (to make login work):
#   1. Create a GitHub OAuth App (on any account with push access to the repo):
#        GitHub → Settings → Developer settings → OAuth Apps → New.
#        - Homepage URL:  https://allisondvm.com
#        - Authorization callback URL:  https://<auth-worker-host>/callback
#      Note the Client ID + generate a Client Secret.
#   2. Deploy the Sveltia auth broker (a small Cloudflare Worker,
#      github.com/sveltia/sveltia-cms-auth) with those as GITHUB_CLIENT_ID /
#      GITHUB_CLIENT_SECRET. It gives you the <auth-worker-host>.
#   3. Set `base_url` below to that worker origin, redeploy the site.
#   Until then, /admin loads but cannot authenticate. The public site is
#   unaffected.
backend:
  name: github
  repo: Allisondvm/allison-dvm-site
  branch: main
  # base_url: https://<auth-worker-host>   # set after the Worker is deployed

# Store uploaded images alongside the site's static assets.
media_folder: "public/uploads"
public_folder: "/uploads"

# Editorial workflow gives drafts a review step before publish.
publish_mode: editorial_workflow

collections:
  - name: "posts"
    label: "Blog posts"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "publications"
    label: "Publications & presentations"
    folder: "src/content/publications"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - {
          label: "Kind",
          name: "kind",
          widget: "select",
          options: ["article", "presentation"],
          default: "article",
        }
      - { label: "DOI", name: "doi", widget: "string", required: false }
      - { label: "URL", name: "url", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 999 }
