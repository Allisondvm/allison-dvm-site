worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache hashed static assets aggressively; HTML stays fresh.
    map $uri $cache_control {
        default                 "public, max-age=3600";
        ~*\.(css|js|woff2?)$    "public, max-age=31536000, immutable";
        ~*\.(png|jpg|jpeg|gif|svg|ico|webp|pdf)$ "public, max-age=604800";
        ~*\.html$               "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never emit absolute redirects: behind a reverse proxy an absolute
        # Location would leak this origin's internal host and port.
        absolute_redirect off;
        port_in_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control;

        # ── PRE-LAUNCH NOINDEX ───────────────────────────────────────────────
        # While the site is in private review, tell crawlers not to index it.
        # This is belt-and-suspenders with the Traefik chain-no-auth middleware
        # (X-Robots-Tag: none) and robots.txt + <meta name="robots" noindex>.
        # REMOVE this header (and switch robots.txt + meta) on go-live.
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Flat-file build: /about serves /about.html directly, no redirect.
        location / {
            try_files $uri $uri.html $uri/index.html @notfound;
        }

        location @notfound {
            return 404;
        }

        # Serve the custom 404 body, but never let a CDN cache a negative
        # response: a 404 for a not-yet-deployed asset would otherwise get
        # cached and keep 404ing after the asset ships.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-store" always;
        }
    }
}
